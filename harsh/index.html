},XIU_SONG:{"{xx.jiao}":`角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。`,"{xx.kang}":`亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。`,"{xx.di}":`氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。`,"{xx.fang}":`房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。`,"{xx.xin}":`心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。`,"{xx.tail}":`尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。`,"{xx.ji}":`箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。`,"{xx.dou}":`斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。`,"{xx.niu}":`牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。`,"{xx.nv}":`女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。`,"{xx.xu}":`虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。`,"{xx.wei}":`危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。`,"{xx.shi}":`室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。`,"{xx.qiang}":`壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。`,"{xx.kui}":`奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。`,"{xx.lou}":`娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。`,"{xx.vei}":`胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。`,"{xx.mao}":`昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。`,"{xx.bi}":`毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。`,"{xx.zi}":`觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。`,"{xx.can}":`参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。`,"{xx.jing}":`井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。`,"{xx.gui}":`鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。`,"{xx.liu}":`柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。`,"{xx.xing}":`星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。`,"{xx.zhang}":`张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。`,"{xx.yi}":`翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。`,"{xx.zhen}":`轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。`},ZHENG:{"{xx.jiao}":`{wx.mu}`,"{xx.jing}":`{wx.mu}`,"{xx.kui}":`{wx.mu}`,"{xx.dou}":`{wx.mu}`,"{xx.kang}":`{wx.jin}`,"{xx.gui}":`{wx.jin}`,"{xx.lou}":`{wx.jin}`,"{xx.niu}":`{wx.jin}`,"{xx.di}":`{wx.tu}`,"{xx.liu}":`{wx.tu}`,"{xx.vei}":`{wx.tu}`,"{xx.nv}":`{wx.tu}`,"{xx.fang}":`{wx.ri}`,"{xx.xing}":`{wx.ri}`,"{xx.mao}":`{wx.ri}`,"{xx.xu}":`{wx.ri}`,"{xx.xin}":`{wx.yue}`,"{xx.zhang}":`{wx.yue}`,"{xx.bi}":`{wx.yue}`,"{xx.wei}":`{wx.yue}`,"{xx.tail}":`{wx.huo}`,"{xx.yi}":`{wx.huo}`,"{xx.zi}":`{wx.huo}`,"{xx.shi}":`{wx.huo}`,"{xx.ji}":`{wx.shui}`,"{xx.zhen}":`{wx.shui}`,"{xx.can}":`{wx.shui}`,"{xx.qiang}":`{wx.shui}`},ANIMAL:{"{xx.jiao}":`{dw.jiao}`,"{xx.dou}":`{dw.xie}`,"{xx.kui}":`{dw.lang}`,"{xx.jing}":`{dw.han}`,"{xx.kang}":`{dw.long}`,"{xx.niu}":`{dw.niu}`,"{xx.lou}":`{dw.gou}`,"{xx.gui}":`{dw.yang}`,"{xx.nv}":`{dw.fu}`,"{xx.di}":`{dw.he}`,"{xx.vei}":`{dw.zhi}`,"{xx.liu}":`{dw.zhang}`,"{xx.fang}":`{dw.tu}`,"{xx.xu}":`{dw.shu}`,"{xx.mao}":`{dw.ji}`,"{xx.xing}":`{dw.ma}`,"{xx.xin}":`{dw.huLi}`,"{xx.wei}":`{dw.yan}`,"{xx.bi}":`{dw.wu}`,"{xx.zhang}":`{dw.lu}`,"{xx.tail}":`{dw.hu}`,"{xx.shi}":`{dw.zhu}`,"{xx.zi}":`{dw.hou}`,"{xx.yi}":`{dw.she}`,"{xx.ji}":`{dw.bao}`,"{xx.qiang}":`{dw.xu}`,"{xx.can}":`{dw.yuan}`,"{xx.zhen}":`{dw.yin}`},GONG:{"{xx.jiao}":`{ps.dong}`,"{xx.jing}":`{ps.nan}`,"{xx.kui}":`{ps.xi}`,"{xx.dou}":`{ps.bei}`,"{xx.kang}":`{ps.dong}`,"{xx.gui}":`{ps.nan}`,"{xx.lou}":`{ps.xi}`,"{xx.niu}":`{ps.bei}`,"{xx.di}":`{ps.dong}`,"{xx.liu}":`{ps.nan}`,"{xx.vei}":`{ps.xi}`,"{xx.nv}":`{ps.bei}`,"{xx.fang}":`{ps.dong}`,"{xx.xing}":`{ps.nan}`,"{xx.mao}":`{ps.xi}`,"{xx.xu}":`{ps.bei}`,"{xx.xin}":`{ps.dong}`,"{xx.zhang}":`{ps.nan}`,"{xx.bi}":`{ps.xi}`,"{xx.wei}":`{ps.bei}`,"{xx.tail}":`{ps.dong}`,"{xx.yi}":`{ps.nan}`,"{xx.zi}":`{ps.xi}`,"{xx.shi}":`{ps.bei}`,"{xx.ji}":`{ps. 당장.`},9:{symbol:`맑은 빗물과 이슬(계수)`,text:`이슬이다. 생각이 많다고 자랑하지만 그 생각의 대부분은 걱정이고, 걱정의 대부분은 행동 안 하려는 핑계다. 머릿속에서 백 번 한 일은 한 번도 안 한 일이다. 상상 속의 너는 이미 망했다가 살아났다가 난리인데 현실의 너는 누워 있다. 일어나라.`}},jt={wood:`목이 넘친다. 벌이는 건 선수, 수습은 젬병이다. 시작이 능력이면 세상은 창업자로 가득하다. 수습이 능력이다. 방치 중인 일 하나는 오늘 끝내고 하나는 접어라.`,fire:`화가 넘친다. 열 받아서 결정하고 식으면 후회하는 걸 인생에서 몇 번째 반복 중인가. 화났을 때 보낸 메시지 중 잘한 거 하나라도 있나. 결정은 하룻밤 재워서 해라.`,earth:`토가 넘친다. 신중한 게 아니라 움직이기 싫은 거다. 안전한 자리에 앉아 기회가 지나가는 걸 구경하고 있다. 그러다 남이 잡으면 운이 좋았다고 배 아파한다. 일어나라.`,metal:`금이 넘친다. 옳은 말로 사람을 이기는 재주가 있다. 그래서 곁에 사람이 없다. 이기고 혼자 남으면 그건 승리가 아니다. 말끝을 한 단계 낮추는 연습부터 해라.`,water:`수가 넘친다. 생각이 너무 많아서 몸이 못 따라온다. 고민은 일이 아니다. 생각 10분 했으면 행동 1분은 해라. 오늘 할 일 딱 하나만 끝내라.`},Mt={wood:`목이 없다. 시작하는 힘이 약하다. 안 한 일은 실패도 성공도 못 한다. 실패가 두려워 아무것도 안 하는 사람이 제일 많이 잃는다. 작게라도 오늘 시작해라.`,fire:`화가 없다. 열정이 식은 게 아니라 원래 약하다. 구석에서 눈치 보며 안전하다고 착각 중이다. 사람 속으로 들어가서 부딪히고 표현해라. 숨는다고 안전해지지 않는다. 그냥 잊힌다.`,earth:`토가 없다. 중심이 없다. 휩쓸리는 걸 자유라 부르지 마라. 뿌리가 없는 거다. 바람 불면 눕는 풀이 되기 싫으면 루틴부터 만들어라. 기상 시간부터.`,metal:`금이 없다. 못 끊는다. 질질 끄는 관계, 질질 끄는 일, 전부 네가 안 끊어서 이어지고 있다. 정 때문이라 하지 마라. 결정이 무서운 거다. 오늘 하나 끊어라.`,water:`수가 없다. 쉬는 법을 모른다. 바쁜 걸 성실로 착각하지 마라. 쉬라고 할 때 안 쉬면 몸이 강제로 쉬게 만든다. 그때는 선택권이 없다. 먼저 쉬는 쪽이 이긴다.`},Nt={wood:`어깨·목·눈이 먼저 비명을 지르는 타입인데 모른 척 버틴다. 그건 성실이 아니라 방치다. 몸은 청구서를 꼭 보낸다. 한 시간에 한 번은 일어나서 몸을 펴라.`,fire:`잠 줄여서 일하고, 열 받고, 더 못 자는 악순환이다. 잠이 제일 싼 보약이다. 안 자고 하는 일은 효율도 반토막이다.`,earth:`스트레스를 속으로 그대로 받아낸다. 대충 때우는 끼니, 야식, 폭식이 위로가 되는 줄 아나? 위로는 되는데 몸이 값을 치른다. 식사부터 정상화해라.`,metal:`건조한 계절에 숨과 피부가 먼저 신호를 준다. 물 안 마시고 환기 안 하면서 컨디션 탓하지 마라. 기본부터 지켜라.`,water:`몸이 차가워지기 쉽다. 폰 보면서 누워 있는 건 쉬는 게 아니다. 하체를 따뜻하게 하고 잠은 제대로 자라.`},Pt={비견:{title:`혼자 서는 해`,headline:`네 발로 서지 않으면 아무도 안 일으켜 준다`,text:`나와 비슷한 힘이 몰려든다. 동료도 늘지만 경쟁자도 는다. 자존심 싸움으로 에너지를 태우지 마라. 혼자 다 하겠다는 객기는 돈과 사람을 같이 잃게 한다. 올해 안에 네 편과 아닌 사람을 가려라. 못 가리면 가려지는 건 너다.`},겁재:{title:`남이 네 몫을 노리는 해`,headline:`이기고 싶은 마음이 지갑을 턴다`,text:`승부와 경쟁이 한꺼번에 몰려온다. 이기고 싶다는 감정이 판단을 흐리고 보증, 동업, 무리한 투자가 구멍이 된다. 이겨도 남는 게 없는 싸움에 왜 힘을 쏟나. 이기는 싸움만 골라라. 아니면 돈 빌려 달라는 전화 받을 준비나 해라.`},식신:{title:`결실을 보는 해`,headline:`그동안 한 만큼 정확히 나온다`,text:`해 온 만큼 나온다. 그래서 무섭다. 한 게 없으면 나올 것도 없다. 재능이 풀리고 마음이 편해지는 해인데 편해졌다고 늘어지면 이 좋은 해를 그냥 흘려보낸다. 실력은 편할 때 굳힌다. 힘들 때만 하는 건 노력이 아니라 몸부림이다.`},상관:{title:`입이 문제인 해`,headline:`재능은 폭발, 입은 지뢰`,text:`아이디어도 터지고 입도 터진다. 옳은 말 한답시고 윗사람 앞에서 던진 한마디가 올해 가장 비싼 청구서가 된다. 말 잘하는 게 아니라 말을 가려서 하는 게 실력이다. 보내기 전에 3초 세고, 말하기 전에 한 번 삼켜라.`},편재:{title:`돈이 판을 키우는 해`,headline:`버는 만큼 샌다, 구멍부터 봐라`,text:`돈과 사람과 일이 한꺼번에 움직인다. 들어오는 돈만 보고 신나 있으면 안 된다. 판이 커진 만큼 구멍도 커졌다. 벌어도 남는 게 없는 사람은 못 버는 사람이 아니라 못 지키는 사람이다. 통장부터 쪼개라.`},정재:{title:`쌓는 해`,headline:`지루하게 성실한 사람이 이긴다`,text:`꾀부린 사람이 아니라 꾸준히 한 사람에게 돈이 간다. 한 방 노리다 있는 돈을 날리는 사람이 얼마나 많은지 알면 고정비부터 줄일 거다. 재미는 없는데 결과는 확실한 해다. 재미있는 걸 찾지 말고 결과를 찾아라.`},편관:{title:`시험대에 오르는 해`,headline:`도망가면 작아지고 버티면 단단해진다`,text:`책임과 압박이 한꺼번에 떨어진다. 징징대고 도망가면 그 자리는 남 몫이 된다. 감당하면 직책이 따라오는데 몸이 먼저 무너지면 소용없다. 힘든 건 인정한다. 그래서 어쩔 건가. 일정과 컨디션을 같이 관리해라.`},정관:{title:`평판이 곧 실력인 해`,headline:`사람들은 네가 한 일만 기억한다`,text:`조직이 너를 본다. 기본을 지킨 사람은 인정받고 대충 한 사람은 낙인이 찍힌다. 평소 하던 대로 하다 걸리면 그 이미지는 오래 간다. 약속, 마감, 보고. 가장 지루한 기본이 올해의 승부처다.`},편인:{title:`갈아타고 싶은 해`,headline:`구상만 하다 해가 끝난다`,text:`새로운 분야, 전환, 독특한 공부에 눈이 간다. 문제는 구상만 하다 한 해를 다 쓴다는 거다. 아이디어는 싸다. 시제품 하나가 계획서 열 장보다 낫다. 올해 안에 눈에 보이는 걸 하나 만들어라.`},정인:{title:`도움받는 해`,headline:`귀인은 오는데 알아보는 건 네 몫`,text:`도움, 문서, 자격, 공부가 풀린다. 그러나 기대어 누워 있으면 아무 일도 안 생긴다. 도움은 받은 사람이 결과로 바꿔야 의미가 있다. 받아 놓고 아무것도 안 하면 다음에는 아무도 안 도와준다.`}},Ft={비견:`독립형이다. 남 밑에서 시키는 대로 하는 건 체질이 아니다. 근데 혼자 다 하려다 번아웃 오는 것도 체질이다. 맡길 줄 모르면 딱 네 그릇만큼만 큰다.`,겁재:`승부사 기질이다. 싸움판에서 힘을 쓰는데 싸움이 일상이 되면 사람이 떠난다. 이겼는데 곁에 아무도 없으면 그게 진 거다.`,식신:`재능으로 먹고사는 구조다. 갈고닦으면 빛나는데 편한 맛에 안주하는 순간 녹슨다. 재능 믿고 노력 안 하는 사람이 제일 먼저 따라잡힌다.`,상관:`재주는 넘치고 인내는 모자란다. 틀에 갇히면 답답해서 윗사람과 부딪힌다. 반항이 능력이 되려면 결과가 있어야 한다. 결과 없는 반항은 그냥 투정이다.`,편재:`돈 냄새를 맡는 구조다. 사람 넓게 사귀고 크게 굴리는데 씀씀이도 같이 크다. 버는 재주는 있는데 지키는 재주가 없으면 평생 벌기만 한다.`,정재:`모으고 지키는 구조다. 성실과 신용이 무기다. 안전만 찾다 기회를 놓치는 건 덤이다. 안전한 선택만 하는 사람은 안전하게 제자리다.`,편관:`압박 속에서 일하는 구조다. 위기에 강한 건 인정한다. 근데 평소에도 긴장 속에 사는 게 습관이 되면 몸과 관계가 먼저 지친다. 늘 전투 중인 사람 곁은 쉴 곳이 못 된다.`,정관:`체면과 질서가 중요한 구조다. 조직에서 신뢰받지만 남의 눈 때문에 하고 싶은 걸 못 하고 있진 않은가. 남의 평가로 사는 인생은 남의 인생이다.`,편인:`엉뚱하고 독창적인 구조다. 관심사가 여러 갈래라 한 우물을 못 판다. 늘 시작만 하고 끝이 없는 건 재능이 아니라 습관이다. 파다 만 우물에서는 물이 안 나온다.`,정인:`배우고 기대는 구조다. 어른 복이 있지만 의지하는 버릇이 들면 혼자 설 때 무너진다. 도움받는 것과 기대어 사는 것은 다르다.`},It={장생:`새로 자라는 기운이다. 배움이 빠르고 도움받기 쉽다. 그걸 당연하게 여기면 도움이 끊긴다. 받은 만큼 갚지 않는 사람 곁에는 사람이 안 남는다.`,목욕:`매력과 감정 기복이 큰 기운이다. 인기는 있지만 흔들린다. 기분이 결정을 대신하게 놔두면 후회는 늘 네 몫이다.`,관대:`나서고 싶은 기운이다. 자신감이 넘치는데 인정 욕구가 지나치면 허세가 된다. 인정받고 싶어서 하는 일은 인정받는 순간 끝난다.`,건록:`제 밥벌이는 제 손으로 하는 기운이다. 자립심이 강점인 건 맞다. 도움을 못 받는 건 약점이고, 그걸 자존심이라 부르는 건 변명이다.`,제왕:`정점의 기운이다. 에너지도 자존심도 최대치다. 올라간 사람은 내려오는 법을 모른다. 겸손은 선택이 아니라 보험이다. 보험 없이 질주하다 사고 난 사람이 한둘이 아니다.`,쇠:`한풀 꺾인 노련한 기운이다. 무리하지 않는 건 지혜일 수도 있고 핑계일 수도 있다. 어느 쪽인지는 네가 제일 잘 안다.`,병:`기운이 약해지는 자리다. 섬세하고 생각이 깊지만 체력은 정직하다. 관리 안 하면 생각만 늘고 몸은 못 따라온다. 생각만으로 되는 일은 없다.`,사:`안으로 갈무리하는 기운이다. 깊이는 있지만 표현 안 하면 아무도 모른다. 알아주길 바라는 건 상대에게 독심술을 요구하는 거다.`,묘:`쌓아 두는 기운이다. 알뜰하고 속이 깊은데 움켜쥐고 안 풀면 썩는다. 모으기만 하고 쓰지 않은 건 없는 것과 같다.`,절:`끊겼다 다시 시작하는 기운이다. 기복이 크지만 갈아엎을 힘이다. 대신 안정은 누가 안 준다. 스스로 만들어야 한다.`,태:`가능성을 품은 기운이다. 구상만 하고 낳지 않으면 가능성은 영원히 가능성일 뿐이다. 낳아라.`,양:`길러지는 기운이다. 환경에 순응하며 큰다. 순응만 하다 네 의견이 사라지는 건 순한 게 아니라 없는 거다.`},Lt={dohwa:`사람을 끄는 매력이다. 인기는 무기지만 관리 못 하면 족쇄다. 이성 문제가 복잡해지는 건 매력 탓이 아니라 선을 못 긋는 탓이다. 매력을 핑계로 쓰지 마라.`,yeokma:`가만히 있으면 몸이 근질거리는 기운이다. 이동, 출장, 이직, 변화가 따라다닌다. 방향 없이 움직이면 그냥 떠돌이다. 어디로 가는지부터 정해라.`,hwagae:`혼자만의 세계가 있는 기운이다. 예술·학문·사색에 끌린다. 고독을 즐기는 것과 사람을 피하는 것은 다르다. 후자라면 핑계 대지 마라.`,cheoneul:`어려울 때 도움이 오는 귀인의 기운이다. 단, 귀인은 움직이는 사람 앞에만 나타난다. 앉아서 기다리는 사람에게는 안 온다.`,gongmang:`이 자리의 기운이 비어 있다. 기대한 만큼 채워지지 않는다는 뜻이다. 집착할수록 더 비는 자리다. 내려놓는 연습이 처방이다.`,yangin:`날이 선 기운이다. 결단과 추진력은 무기, 욱하는 성질은 흉기다. 칼은 쓰는 사람이 다치지 않게 쥐어야 한다. 그 칼, 지금 누구를 향하고 있나.`},Rt={wood:`목이 필요하다. 시작하고 배우고 자라는 쪽으로 움직여라. 가만히 있으면 약해지는 구조다. 식물, 초록색, 새로운 공부부터. 오늘 뭐라도 시작해라.`,fire:`화가 필요하다. 숨지 말고 드러내라. 햇볕 쬐고 사람 만나고 표현해라. 혼자 끙끙대는 게 네 최대의 적이다. 방에서 나와라.`,earth:`토가 필요하다. 중심과 기반이다. 루틴, 저축, 규칙적인 생활. 화려한 건 나중이고 땅부터 다져라. 기초 없이 올린 건물은 흔들린다.`,metal:`금이 필요하다. 끊고 정리하고 기준을 세워라. 미련 남은 물건, 관계, 일부터 정리해라. 못 버리는 사람은 못 채운다.`,water:`수가 필요하다. 쉬고 생각을 정리해라. 잠, 독서, 사색. 쉬는 것도 일의 일부다. 안 쉬는 건 성실이 아니라 무지다.`},zt={비견:`10년간 내 힘으로 서야 한다. 동료도 경쟁자도 는다. 누가 도와주길 기다리면 10년이 그냥 간다.`,겁재:`10년간 싸움판이다. 도전은 많은데 새는 돈도 많다. 이기는 싸움만 골라라. 아니면 이기고도 빈손이다.`,식신:`10년간 먹고 즐길 여유와 결실이 온다. 늘어지면 그대로 퍼진다. 이 10년에 실력으로 굳히지 못하면 다음 10년은 후회로 쓴다.`,상관:`10년간 변화와 반항의 시기다. 창의력이 터지고 조직과 부딪힌다. 입 조심, 태도 조심. 뱉은 말은 오래 따라다닌다.`,편재:`10년간 판이 커진다. 사업, 투자, 인맥 확장의 기회가 오지만 기복도 같이 온다. 통장 관리 못 하면 큰돈도 샌다. 큰돈은 큰 구멍과 같이 온다.`,정재:`10년간 착실히 쌓는다. 성실이 곧 돈이다. 요행을 바라면 이 좋은 시기를 날린다. 쌓는 시기에 안 쌓으면 쓸 때 가난하다.`,편관:`10년간 단련의 시기다. 압박은 크고 책임은 무겁다. 견디면 직책이 따라오고 도망가면 후회가 따라온다. 몸부터 챙겨라.`,정관:`10년간 인정과 지위의 시기다. 신뢰를 쌓는 데 쓰면 오래 간다. 체면에 갇히면 10년 내내 남 눈치만 보다 끝난다.`,편인:`10년간 방향을 바꾸고 싶어진다. 새 공부와 전환에 좋지만 고민만 하다 10년이 간다. 일단 하나 정해라. 아무거나 하나가 아무것도 안 하는 것보다 낫다.`,정인:`10년간 배우고 도움받는다. 자격과 기반을 만들 시기다. 기대기만 하면 끝나고 남는 게 없다. 받는 시기에 만들지 못하면 주는 시기에 빈손이다.`},Bt=e=>e>=.4?`지금 네게 필요한 기운이 들어온다. 이때 움직이지 않으면 변명할 거리도 없다.`:e<=-.4?`기운이 버겁다. 판 벌리지 말고 버텨라. 기반 다지는 데만 써라.`:`좋지도 나쁘지도 않은 시기다. 그래서 운 탓은 못 하고 실력이 그대로 드러난다.`,Vt={비견:`고집이 세지고 동료와 부딪히거나 뭉치는 달이다. 자존심 싸움에 힘 빼지 마라.`,겁재:`지갑 열기 전에 두 번 생각해라. 경쟁자가 판을 흔드는 달이다. 충동구매, 충동투자 금지.`,식신:`여유 있게 풀리는 달이다. 여유를 늘어짐으로 착각하면 기회는 지나간다.`,상관:`입이 앞서는 달이다. 보내기 전에 한 번 더 읽고, 말하기 전에 3초 세라.`,편재:`돈이 오가는 달이다. 들어오는 것만 보지 말고 나가는 것도 봐라.`,정재:`일한 만큼 들어오는 달이다. 꾀부린 흔적은 그대로 티 난다.`,편관:`압박과 책임이 몰리는 달이다. 도망치지 말고 순서대로 처리해라. 피하면 쌓일 뿐이다.`,정관:`평가받는 달이다. 기본을 지킨 사람이 웃고 못 지킨 사람이 기억된다.`,편인:`생각이 많아지는 달이다. 고민만 하지 말고 하나 시작해라.`,정인:`도움받고 문서·공부가 풀리는 달이다. 받았으면 결과로 갚아라.`},Ht={5:`올해는 판이 네 편이다. 이런 해에 못 움직이면 그건 운 탓이 아니라 네 탓이다. 변명은 못 한다.`,4:`대체로 순풍이다. 계획이 있었으면 지금 밀어라. 미루다 바람이 바뀌면 또 운 탓할 건가.`,3:`평범한 해다. 운이 밀어주지도 막아주지도 않는다. 결과는 오롯이 네 실력과 태도다. 운 탓은 못 한다.`,2:`버거운 해다. 확장하지 말고 기반과 건강, 사람부터 지켜라. 욕심내면 청구서가 온다.`,1:`낮게 엎드려야 하는 해다. 큰 결정, 큰 투자, 큰 싸움은 미뤄라. 억울해도 이를 악물고 지나가라. 버티는 것도 전략이다.`},Ut={0:{symbol:`곧게 자라는 큰 나무(갑목)`,text:`곧고 정직하며 앞으로 나아가려는 힘이 큰 사람입니다. 리더 역할에 잘 어울리고 시작하는 힘이 좋지만, 한번 정한 방향을 굽히지 않아 융통성이 부족하다는 말을 들을 수 있습니다.`},1:{symbol:`유연한 풀과 덩굴(을목)`,text:`부드럽고 적응력이 뛰어난 사람입니다. 환경에 맞춰 끈질기게 길을 찾아내며 사람 사이를 조율하는 데 능합니다. 속으로는 고집이 있어도 겉으로 드러내지 않는 편이라 마음고생을 혼자 안기 쉽습니다.`},2:{symbol:`밝은 태양(병화)`,text:`밝고 열정적이며 숨기는 것 없이 솔직한 사람입니다. 주변을 환하게 만드는 표현력과 에너지가 있습니다. 다만 성격이 급해 끝맺음이 약해지거나, 감정이 얼굴에 바로 드러나는 점은 다듬으면 좋습니다.`},3:{symbol:`은은한 촛불(정화)`,text:`섬세하고 따뜻하며 한 가지에 깊게 집중하는 사람입니다. 사람의 마음을 잘 헤아리고 조용히 빛을 내는 타입입니다. 감정이 예민해 사소한 말에도 오래 마음을 쓰는 편이니 스스로를 쉬게 하는 시간이 필요합니다.`},4:{symbol:`듬직한 큰 산(무토)`,text:`묵직하고 믿음직하며 쉽게 흔들리지 않는 사람입니다. 신중하고 포용력이 있어 주변이 기대는 존재가 되곤 합니다. 변화에 느리고 고집이 센 면이 있어, 때로는 한 발 먼저 움직이는 용기가 도움이 됩니다.`},5:{symbol:`기름진 논밭(기토)`,text:`꼼꼼하고 현실적이며 사람을 품어 키우는 힘이 있는 사람입니다. 실속 있게 일을 챙기고 뒷받침하는 데 강합니다. 걱정이 많고 속으로 따져보는 시간이 길어, 결정을 미루지 않도록 기준을 정해 두면 좋습니다.`},6:{symbol:`단단한 바위와 쇠(경금)`,text:`결단력 있고 의리가 강하며 맺고 끊음이 분명한 사람입니다. 불의를 보면 참지 않는 강직함이 있습니다. 말이 직설적이어서 의도와 달리 날카롭게 들릴 수 있으니, 표현을 한 겹 부드럽게 하면 더 큰 신뢰를 얻습니다.`},7:{symbol:`빛나는 보석(신금)`,text:`섬세하고 감각이 예리하며 완성도를 중시하는 사람입니다. 자신만의 기준이 뚜렷하고 외모·품격에 신경을 씁니다. 자존심이 강하고 예민해 스트레스를 안으로 쌓기 쉬우니, 완벽하지 않아도 괜찮다는 여유가 필요합니다.`},8:{symbol:`큰 강과 바다(임수)`,text:`지혜롭고 포용력이 크며 자유로운 흐름을 좋아하는 사람입니다. 넓게 보고 판단하며 새로운 환경에도 잘 스며듭니다. 속마음을 잘 드러내지 않아 거리감이 느껴질 수 있고, 하고 싶은 일이 많아 정리가 필요할 때가 있습니다.`},9:{symbol:`맑은 빗물과 이슬(계수)`,text:`직관이 좋고 차분하며 감수성이 풍부한 사람입니다. 조용히 관찰하다가 핵심을 짚어내는 힘이 있습니다. 생각이 많아 걱정이 커지기 쉬우니, 생각을 글이나 대화로 꺼내 정리하는 습관이 도움이 됩니다.`}},Wt={wood:`목(木)`,fire:`화(火)`,earth:`토(土)`,metal:`금(金)`,water:`수(水)`},Gt={wood:`목의 기운이 많아 의욕과 추진력이 넘치고 일을 벌이는 편입니다. 다만 고집이 세지거나 여러 가지를 동시에 벌여 지칠 수 있습니다.`,fire:`화의 기운이 많아 열정과 표현력이 풍부합니다. 다만 감정의 기복이 크거나 성급하게 결론을 내리기 쉬우니 한 템포 쉬어 가면 좋습니다.`,earth:`토의 기운이 많아 신중하고 안정을 추구합니다. 다만 생각이 많고 변화를 주저해 기회를 놓치지 않도록 주의하세요.`,metal:`금의 기운이 많아 원칙과 결단력이 강합니다. 다만 냉정하거나 날카롭게 비칠 수 있어 부드러운 소통이 도움이 됩니다.`,water:`수의 기운이 많아 생각이 깊고 유연합니다. 다만 걱정과 상상이 많아 행동이 늦어지거나 마음이 불안정해질 수 있습니다.`},Kt={wood:`목의 기운이 부족해 새로 시작하는 힘이나 성장 에너지를 일부러 채워 주면 좋습니다. 새로운 배움이나 야외 활동이 도움이 됩니다.`,fire:`화의 기운이 부족해 활력과 자기표현이 약해질 수 있습니다. 사람들과 어울리며 마음을 표현하는 활동이 도움이 됩니다.`,earth:`토의 기운이 부족해 중심을 잡는 안정감이 약할 수 있습니다. 규칙적인 생활과 꾸준한 루틴이 도움이 됩니다.`,metal:`금의 기운이 부족해 맺고 끊는 결단이나 마무리가 약할 수 있습니다. 기준과 마감일을 정해 두면 좋습니다.`,water:`수의 기운이 부족해 유연함과 쉬어 가는 여유가 부족할 수 있습니다. 충분한 휴식과 정리하는 시간이 도움이 됩니다.`},qt={wood:`목 기운과 관련해 긴장성 피로, 어깨·목 뭉침, 눈의 피로에 신경 쓰면 좋습니다. 스트레칭을 자주 해 주세요.`,fire:`화 기운과 관련해 수면 부족, 열감, 스트레스에 의한 두근거림에 유의하세요. 충분한 수면과 휴식이 도움이 됩니다.`,earth:`토 기운과 관련해 식습관, 소화 컨디션을 살피면 좋습니다. 규칙적인 식사와 과식 피하기를 권합니다.`,metal:`금 기운과 관련해 호흡기, 피부 건조에 유의하세요. 환절기에 실내 습도와 수분 섭취를 챙기면 좋습니다.`,water:`수 기운과 관련해 몸이 차가워지기 쉬운 경향이 있습니다. 하체를 따뜻하게 하고 수분·휴식의 균형을 맞추세요.`},Jt={비견:{title:`나 자신을 단단히 세우는 해`,headline:`독립심과 자기 주도가 커지는 해`,text:`나와 비슷한 힘, 곧 동료·친구·경쟁자가 늘어나는 흐름입니다. 자신감과 독립심이 커지는 반면 주변과 주도권을 다투거나 지출이 늘 수 있어, 협력할 상대와 경쟁할 상대를 구분하는 것이 중요합니다.`},겁재:{title:`경쟁과 승부의 해`,headline:`경쟁 속에서 실력을 증명하는 해`,text:`경쟁자나 승부욕이 부각되는 흐름입니다. 도전 의식이 커지는 대신 재물이 새거나 사람 관계에서 소모가 생길 수 있으니, 큰 투자·보증·동업은 한 번 더 따져 보세요.`},식신:{title:`여유와 결실의 해`,headline:`표현하고 즐기며 결실을 맺는 해`,text:`재능과 표현력이 자연스럽게 빛나는 흐름입니다. 먹고 즐기는 여유, 취미와 창작, 실무 성과가 좋아지고 마음도 편안해지기 쉽습니다. 꾸준히 해 온 일의 결과를 거두기 좋습니다.`},상관:{title:`표현과 변화의 해`,headline:`재능을 드러내되 말을 조심하는 해`,text:`아이디어와 표현력이 폭발하고 기존 틀을 깨고 싶은 마음이 커지는 흐름입니다. 창의적인 일에는 좋지만, 직설적인 말로 윗사람·조직과 마찰이 생기기 쉬우니 표현의 수위를 조절하세요.`},편재:{title:`움직이는 재물의 해`,headline:`활동 반경과 기회가 넓어지는 해`,text:`큰돈의 흐름과 활동 범위가 넓어지는 흐름입니다. 사업·영업·투자 등 능동적으로 움직일수록 기회가 오지만, 수입과 지출의 폭도 함께 커질 수 있어 관리가 필요합니다.`},정재:{title:`안정적인 수확의 해`,headline:`꾸준한 노력이 재물로 이어지는 해`,text:`성실하게 일한 만큼 안정적인 수입이 들어오는 흐름입니다. 저축·계획적 소비, 현실적인 관계 정리에 좋은 해입니다. 큰 모험보다는 알뜰하게 쌓아 가는 쪽이 유리합니다.`},편관:{title:`책임과 시험의 해`,headline:`부담 속에서 단련되는 해`,text:`책임과 압박, 도전 과제가 커지는 흐름입니다. 힘들게 느껴지지만 그만큼 실력을 인정받고 단단해질 기회입니다. 무리하지 말고 건강과 일정 관리에 신경 쓰세요.`},정관:{title:`인정과 질서의 해`,headline:`신뢰와 명예를 쌓는 해`,text:`조직 안에서 인정받고 책임 있는 자리에 서기 쉬운 흐름입니다. 원칙을 지키고 성실하게 임하면 평판과 지위가 안정적으로 올라갑니다. 규칙과 약속을 중시하는 해입니다.`},편인:{title:`새로운 배움과 전환의 해`,headline:`생각의 방향을 바꾸고 새 길을 탐색하는 해`,text:`독특한 아이디어와 새로운 분야에 대한 관심이 커지는 흐름입니다. 전환·재교육·특수한 공부에 좋지만 생각이 많아 결정이 늦어지거나 혼자 고민하기 쉬우니 의논할 상대를 두세요.`},정인:{title:`도움과 배움의 해`,headline:`귀인과 문서·자격의 도움을 받는 해`,text:`윗사람이나 주변의 도움을 받고 마음이 안정되는 흐름입니다. 공부·자격증·계약·문서 일에 유리하고, 쉬면서 재충전하기에도 좋습니다. 다만 의존하려는 마음이 커지지 않도록 주도권은 스스로 쥐세요.`}},I={비견:`스스로 서는 힘이 강한 구조입니다. 독립심이 강해 자기 사업이나 전문직에서 힘을 내며, 협업보다 주도권을 쥘 때 편안합니다.`,겁재:`승부욕과 추진력이 매우 강한 구조입니다. 도전적인 환경에서 두각을 나타내지만 경쟁과 충돌도 따라오기 쉬워 감정 조절이 중요합니다.`,식신:`재능과 여유로 성과를 내는 구조입니다. 기술·요리·교육·창작처럼 꾸준히 갈고닦는 일에 어울리고 성품이 온화한 편입니다.`,상관:`재기발랄하고 표현력이 강한 구조입니다. 예술·기획·언변이 필요한 일에 어울리고, 틀에 갇히면 답답해하며 권위와 부딪히기 쉽습니다.`,편재:`활동적이고 돈의 흐름을 읽는 구조입니다. 사업·영업·투자 감각이 있고 사람을 널리 사귀지만 씀씀이도 큰 편입니다.`,정재:`성실하게 모으고 지키는 구조입니다. 안정적인 직장·관리·재무에 어울리고 계획적이며 신용을 중시합니다.`,편관:`책임감과 추진력, 그리고 압박을 함께 지는 구조입니다. 규율과 긴장이 있는 일(군·경·법·의료 등)에 어울리고 위기에 강합니다.`,정관:`질서와 명예를 중시하는 구조입니다. 조직과 공직·관리직에서 신뢰를 얻기 쉽고 단정하며 책임감이 강합니다.`,편인:`독창적이고 직관적인 구조입니다. 연구·상담·예술·특수 기술 분야에 어울리고 생각이 많으며 관심사가 여러 갈래일 수 있습니다.`,정인:`배움과 보호받는 힘이 강한 구조입니다. 학문·교육·문서·자격 분야에 어울리고 어른의 도움을 받기 쉬우며 안정을 좋아합니다.`},Yt={장생:`새로 태어나 자라는 기운입니다. 순수하고 배움이 빠르며 주변의 도움을 받기 쉽습니다.`,목욕:`감수성과 매력이 큰 시기의 기운입니다. 인기는 있으나 감정 기복과 변화가 잦을 수 있습니다.`,관대:`사회로 나서는 청년의 기운입니다. 자신감과 의욕이 넘치고 인정받고 싶어 합니다.`,건록:`독립해 자리를 잡은 기운입니다. 자립심이 강하고 자기 힘으로 일을 해냅니다.`,제왕:`정점에 오른 강한 기운입니다. 에너지와 자존심이 매우 강해 리더십이 있으나 고집이 될 수 있습니다.`,쇠:`한 풀 꺾이며 성숙해지는 기운입니다. 노련하고 차분하며 무리하지 않는 편입니다.`,병:`에너지가 줄어드는 기운입니다. 섬세하고 생각이 깊으나 체력 관리가 필요합니다.`,사:`겉으로 드러내기보다 안으로 갈무리하는 기운입니다. 정신적·학구적인 면이 강합니다.`,묘:`저장하고 간직하는 기운입니다. 알뜰하고 속이 깊으며 모으는 데 능합니다.`,절:`끊어졌다 새로 시작하는 기운입니다. 기복이 있지만 전환과 재출발의 힘이 큽니다.`,태:`새로운 가능성을 품은 기운입니다. 구상이 많고 시작이 늦더라도 가능성이 큽니다.`,양:`길러지며 준비하는 기운입니다. 도움받는 환경에서 성장하며 순응적인 면이 있습니다.`},Xt={dohwa:`사람을 끄는 매력과 인기의 기운입니다. 예술·서비스·대인 직업에서 강점이 되며 이성 인연이 많은 편이지만, 지나치면 관계가 복잡해질 수 있습니다.`,yeokma:`움직임과 변화의 기운입니다. 이동·출장·여행·해외·이직이 잦거나 활동 범위가 넓은 삶과 연결됩니다.`,hwagae:`정신세계와 예술·학문의 기운입니다. 혼자 있는 시간을 즐기고 철학·종교·예술·연구에 끌리기 쉽습니다.`,cheoneul:`위기에 도움을 주는 귀인의 기운입니다. 어려울 때 주변에서 도움이 오는 편으로 봅니다.`,gongmang:`해당 자리의 기운이 비어 있다고 보는 표시입니다. 그 영역에서 기대와 현실의 차이를 느끼기 쉽지만, 집착을 내려놓고 정신적으로 성장하는 자리가 되기도 합니다.`,yangin:`강하고 날카로운 에너지입니다. 결단력과 추진력이 크지만 급한 성격과 다툼에 주의가 필요합니다.`},Zt={년지:`어린 시절과 바깥 환경`,월지:`직장·사회생활`,일지:`나 자신과 배우자 자리`,시지:`자녀와 말년`},Qt={wood:`목(木)은 성장·배움·새로운 시작의 기운입니다. 식물과 가까이 지내고, 초록 계열을 가까이 두고, 새로운 공부나 취미를 시작하는 것이 도움이 됩니다.`,fire:`화(火)는 열정·표현·활력의 기운입니다. 밝고 따뜻한 환경에서 햇볕을 쬐고, 사람들과 어울리며 마음을 표현하는 활동이 도움이 됩니다.`,earth:`토(土)는 안정·신뢰·중심의 기운입니다. 규칙적인 생활 루틴, 꾸준한 저축과 기반 다지기, 차분한 환경이 도움이 됩니다.`,metal:`금(金)은 결단·정리·원칙의 기운입니다. 불필요한 것을 정리하고, 기준과 마감을 세우고, 규칙적인 운동을 하는 것이 도움이 됩니다.`,water:`수(水)는 지혜·휴식·유연함의 기운입니다. 충분한 수면과 휴식, 독서와 사색, 유연한 소통이 도움이 됩니다.`},$t={비견:`스스로 일어서고 동료·경쟁자와 어울리는 10년입니다. 독립심이 커지고 협업과 경쟁이 함께 옵니다.`,겁재:`승부와 경쟁의 10년입니다. 도전은 활발하지만 재물과 관계에서 소모가 생길 수 있어 신중함이 필요합니다.`,식신:`재능을 펼치고 여유를 누리는 10년입니다. 건강과 표현, 실속 있는 결실을 쌓기 좋습니다.`,상관:`변화와 표현의 10년입니다. 창의성이 커지고 틀을 깨려는 마음이 크며, 조직과의 마찰은 주의하세요.`,편재:`활동 반경과 재물의 규모가 커지는 10년입니다. 사업·투자·인맥 확장의 기회가 오지만 기복도 있습니다.`,정재:`안정적으로 재물을 쌓는 10년입니다. 성실한 노력이 결실로 이어지고 생활 기반이 단단해집니다.`,편관:`책임과 압박, 도전이 큰 10년입니다. 단련되는 시기로 직책·권한이 따라오기도 하지만 건강과 스트레스 관리가 중요합니다.`,정관:`인정과 명예를 얻는 10년입니다. 조직 안에서 신뢰를 쌓고 안정적인 지위를 얻기 좋습니다.`,편인:`새로운 배움과 전환의 10년입니다. 독창적인 길을 모색하기 좋으나 고민이 길어질 수 있습니다.`,정인:`배움과 도움을 받는 10년입니다. 공부·자격·귀인의 도움으로 마음이 안정되고 기반이 마련됩니다.`},en=e=>e>=.4?`나에게 필요한 기운이 들어오는 반가운 시기입니다.`:e<=-.4?`기운이 다소 부담스러울 수 있어, 무리하지 않고 기반을 다지는 쪽이 좋은 시기입니다.`:`필요한 기운과 부담스러운 기운이 크게 치우치지 않는 무난한 시기입니다.`,tn={비견:`내 주관이 강해지고 동료와 협력·경쟁이 함께 오는 달`,겁재:`경쟁과 지출에 신경 써야 하는 달`,식신:`여유 있게 일이 풀리고 표현이 편안한 달`,상관:`아이디어는 넘치지만 말을 조심해야 하는 달`,편재:`활동량이 늘고 돈의 움직임이 커지는 달`,정재:`성실한 노력이 수입으로 이어지는 달`,편관:`업무 압박과 책임이 커지는 달`,정관:`신뢰를 얻고 인정받기 좋은 달`,편인:`생각이 많아지고 새로운 공부·전환을 모색하는 달`,정인:`도움을 받고 문서·공부 일이 잘 풀리는 달`},nn={5:`전반적으로 나에게 필요한 기운이 크게 들어오는 매우 반가운 해입니다. 미뤄 둔 도전을 시도하기 좋습니다.`,4:`대체로 순조롭게 흐르는 해입니다. 계획한 일을 추진하면 좋은 결과로 이어지기 쉽습니다.`,3:`크게 좋지도 나쁘지도 않은 평이한 해입니다. 하는 만큼 얻는 해이므로 꾸준함이 중요합니다.`,2:`다소 부담이 따르는 해입니다. 무리한 확장보다 기반을 다지고 건강과 관계를 챙기는 쪽이 좋습니다.`,1:`신중함이 필요한 해입니다. 큰 결정과 투자는 미루고 안정과 휴식을 우선하세요.`},rn={비겁:`경쟁과 협력`,식상:`표현과 실무`,재성:`성과와 수익`,관성:`책임과 평가`,인성:`도움과 학습`},L=(e,...t)=>({text:e,basis:t}),an=(e,t)=>t[e-1];function on(e){let{f:t}=e,n=t.domains.move.stars,r=an(n,[`제자리를 못 떠나는 해`,`살짝 흔들리는 해`,`움직일 일이 생기는 해`,`판이 바뀌는 해`,`짐 쌀 각오를 해야 하는 해`]),i=[L(n<=2?`올해 사는 곳, 일하는 곳이 바뀔 일은 거의 없다. 몸이 근질거린다고 일 벌이지 마라. 지금 불만의 대부분은 장소가 아니라 네 태도에서 나온다. 기반이나 다져라.`:n===3?`출장, 모임, 일정 변화로 활동 반경이 조금 넓어진다. 큰 변화는 아니다. 호들갑 떨지 말고 오는 기회에 가볍게 응해라. 거절만 하다 아무것도 못 잡는 사람이 되지 마라.`:`이사, 이직, 부서 이동, 장거리 출장. 삶의 터전이 흔들리는 해다. 불안하다고 버티면 어차피 떠밀려서 움직이게 된다. 준비하고 움직이는 사람과 떠밀려 움직이는 사람은 결과가 전혀 다르다. 선택해라.`,`이동수 점수 ${t.domains.move.score} → ${n}/5`)];t.yeokma&&i.push(L(`역마가 들어왔다. 가만히 앉아 있기 힘든 해다. 출장, 여행, 이직, 이사, 해외 건이 생긴다. 방향 없이 돌아다니면 피곤만 하고 남는 건 없다. 어디로 가는지 정하고 움직여라.`,`${e.yearLabel}의 ${C[t.seun.branch]}가 역마살`));let a=(e,n,r)=>{let a=t.relations.find(t=>t.kind===e&&t.pos===n);a&&i.push(L(r,`세운 ${C[a.yearBranch]} ↔ ${n} ${C[a.natalBranch]} ${e}`))};return a(`충`,`일지`,`나 자신과 집을 뜻하는 자리가 흔들린다. 이사, 집 수리, 동거·독립 같은 거주 변화가 오기 쉽다. 감정이 올라온 상태로 결정하면 계약서에 후회가 찍힌다. 두 번 읽고 하룻밤 재워라.`),a(`충`,`월지`,`직장이 흔들린다. 부서 이동, 이직, 업무 개편. 불평은 해도 좋지만 불평만 하는 사람이 가장 먼저 밀린다. 이력서와 대안을 미리 만들어 둬라.`),a(`충`,`년지`,`바깥 인간관계나 부모·형제 쪽이 흔들린다. 집안일이나 오래 끌어온 인연을 정리해야 할 수 있다. 미루면 더 커진다.`),a(`충`,`시지`,`자녀나 장기 계획의 일정이 흔들린다. 계획표에 여유가 없으면 올해 다 깨진다.`),t.relations.some(e=>e.kind===`형`)&&i.push(L(`변화 중에 서류, 일정, 사람 사이에서 자잘한 마찰이 따른다. 사소한 실수가 큰 일로 번질 해다. 서류와 일정은 두 번 확인해라.`,`지지 형(刑) 관계`)),{key:`move`,title:`이동수`,stars:n,headline:r,paragraphs:i,advice:n>=4?`피할 생각 말고 준비해라. 계획과 비상금 없이 움직이면 그건 이동이 아니라 도피다.`:`지금 있는 자리에서 실력부터 쌓아라. 옮긴다고 해결되는 문제는 대개 네가 데려가는 문제다.`}}var sn={비견:`동료가 늘고 경쟁자도 는다. 협업이든 경쟁이든 혼자 튀려 하지 마라. 네가 한 일은 결과로만 증명된다. 말로 하는 능력은 회의실에서 끝난다.`,겁재:`공을 다투는 싸움이 벌어진다. 혼자 다 먹으려 하면 사람들이 등 돌린다. 팀워크는 선택이 아니라 생존이다. 성과를 가로채이기 싫으면 기록부터 남겨라.`,식신:`실무에서 성과가 난다. 승진보다 실력 인정에 가깝다. 인정받았다고 느슨해지면 내년에 대가를 치른다. 칭찬은 연료이지 쉬어도 된다는 허락이 아니다.`,상관:`아이디어와 개선안이 빛난다. 동시에 윗사람과 정면충돌하기 쉽다. 옳은 말도 때와 방식을 못 가리면 그냥 무례다. 독립이나 이직이 머리를 스친다면 감정이 아니라 계산으로 해라. 홧김에 쓴 사직서는 통장에서 후회로 돌아온다.`,편재:`결과로 평가받는 일에서 기회가 온다. 영업, 사업, 성과급. 움직이는 만큼 번다. 가만히 있으면 아무것도 없다. 핑계 댈 시간에 한 명 더 만나라.`,정재:`성실한 만큼 안정적인 보상이 온다. 처우 개선을 요구하고 싶으면 근거부터 쌓아라. 요구는 증거가 있을 때만 힘이 있다. 감정만 쌓인 요구는 소음이다.`,편관:`책임과 업무량이 폭증한다. 힘들겠지만 이걸 감당하면 더 큰 직책이 따라온다. 못 견디겠다고 던지면 그 자리는 처음부터 네 것이 아니었던 거다. 일정 짜고 우선순위 정하고 하나씩 해치워라.`,정관:`조직이 너를 평가한다. 승진, 직책, 합격 같은 공식적 인정의 해다. 평소 기본이 안 돼 있으면 이 기회는 남의 것이 된다. 평가는 올해의 성과가 아니라 평소의 태도가 한다.`,편인:`직무 전환, 새 분야 공부, 특수 기술에 유리하다. 당장 성과는 안 난다. 준비하는 해로 쓰되 고민만 하다 끝내지 마라. 올해 안에 눈에 보이는 결과물 하나는 만들어라.`,정인:`윗사람 후원, 자격증, 시험, 문서 운이 좋다. 승진 심사나 자격 취득에 도움이 된다. 기회를 줘도
